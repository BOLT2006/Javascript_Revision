<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javacsript</li>
    </ul>
</body>
<script>
    //ADD
    function addLanguage(langName){
        // In this li element has to traverse wholelist tree
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li) 
    }
    addLanguage("Pyhton")
    addLanguage("Typescript")
    addLanguage("C++")
    addLanguage("Java")

    function addOptiLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li);
    }
    addOptiLanguage("Moongose")

    /* EDIT
    const seconLang = document.querySelector("li:nth-child(2)");
    // seconLang.innerHTML = 'golang'
    const newLi = document.createElement('li');
    newLi.textContent = "Golang"
    seconLang.replaceWith(newLi)
    */
    const firstLang = document.querySelector("li:nth-child(1)")
    firstLang.outerHTML = "<li>Typescript</li>"

    /*REMOVE*/
    const lastLang = document.querySelector("li:last-child")
    lastLang.remove()
</script>
</html>
